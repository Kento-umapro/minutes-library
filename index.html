<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>議事録ライブラリ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1d2430; --sub:#6b7480; --line:#e1e5ea; --accent:#c8102e; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif; }
.num { font-family:'Inter',sans-serif; font-feature-settings:'tnum'; }
.wrap { max-width:860px; margin:0 auto; padding:28px 16px 60px; }
h1 { font-size:22px; font-weight:800; margin:0 0 4px; }
.sub { color:var(--sub); font-size:13px; margin-bottom:22px; }
#lock { max-width:360px; margin:16vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
#lock h1 { font-size:18px; margin-bottom:14px; }
input { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:9px; }
button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:9px; padding:11px 14px; background:var(--ink); color:#fff; }
#lock button { width:100%; margin-top:10px; }
#err { color:var(--accent); font-size:13px; min-height:18px; margin-top:8px; }
.search { margin-bottom:16px; }
.month { font-size:13px; font-weight:800; color:var(--sub); margin:22px 0 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
.date { flex:0 0 58px; text-align:center; border-right:1px solid var(--line); padding-right:12px; }
.date .d { font-size:22px; font-weight:600; line-height:1.1; }
.date .w { font-size:11px; color:var(--sub); }
.body { flex:1; min-width:0; }
.t { font-weight:800; font-size:15px; line-height:1.45; margin-bottom:4px; }
.m { font-size:12px; color:var(--sub); margin-bottom:6px; }
.tag { display:inline-block; font-size:11px; background:#fff3d6; color:#7a5a00; border-radius:5px; padding:1px 6px; margin-left:6px; }
.h { font-size:12px; color:#4a535e; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.btns { display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
.btns button { font-size:13px; padding:8px 12px; white-space:nowrap; }
.btns .ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
@media (max-width:560px) { .card { flex-wrap:wrap; } .btns { flex-direction:row; width:100%; } .btns button { flex:1; } }
</style>
</head>
<body>
<div id="lock">
  <h1>議事録ライブラリ</h1>
  <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password">
  <button id="go">ひらく</button>
  <div id="err"></div>
</div>
<div id="app" class="wrap" hidden>
  <h1>議事録ライブラリ</h1>
  <div class="sub">Genspark の議事録メールから自動で作成した A4 資料　｜　最終更新 <span id="upd" class="num"></span></div>
  <input id="q" class="search" type="search" placeholder="キーワードで絞り込み（例：寺田町、FC、札幌）">
  <div id="list"></div>
</div>
<script>
const ITER = 250000, WEEK = '日月火水木金土';
let KEY = null, ITEMS = [];
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));

async function deriveKey(pass) {
  const salt = b64(await (await fetch('salt.txt', {cache:'no-store'})).text());
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptUrl(url) {
  const buf = new Uint8Array(await (await fetch(url, {cache:'no-store'})).arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, KEY, buf.slice(12));
}
async function unlock(pass) {
  $('#err').textContent = 'ひらいています…';
  try {
    KEY = await deriveKey(pass);
    const data = JSON.parse(new TextDecoder().decode(await decryptUrl('catalog.bin')));
    try { sessionStorage.setItem('mpw', pass); } catch (e) {}
    ITEMS = data.items; $('#upd').textContent = data.updated;
    $('#lock').hidden = true; $('#app').hidden = false; render();
  } catch (e) { KEY = null; $('#err').textContent = '合言葉がちがいます'; }
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render() {
  const q = $('#q').value.trim();
  const rows = ITEMS.filter(it => !q || (it.title + it.headings.join(' ')).includes(q));
  let html = '', cur = '';
  for (const it of rows) {
    const [y, m, d] = it.date.split('-').map(Number);
    const ym = `${y}年${m}月`;
    if (ym !== cur) { html += `<div class="month">${ym}</div>`; cur = ym; }
    const w = WEEK[new Date(y, m - 1, d).getDay()];
    html += `<div class="card"><div class="date"><div class="d num">${m}/${d}</div><div class="w">${w}曜</div></div>
      <div class="body"><div class="t">${esc(it.title)}${it.merged > 1 ? `<span class="tag">録音${it.merged}本をまとめ</span>` : ''}</div>
      <div class="m num">${it.time}〜 ・ 録音 計${it.minutes}分 ・ ${it.pages}ページ</div>
      <div class="h">${esc(it.headings.filter(h => /^\d/.test(h)).join('　'))}</div></div>
      <div class="btns"><button data-id="${it.id}" data-act="open">ひらく</button><button class="ghost" data-id="${it.id}" data-act="dl">保存</button></div></div>`;
  }
  $('#list').innerHTML = html || '<div class="sub">該当する議事録がありません</div>';
}
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const it = ITEMS.find(x => x.id === b.dataset.id);
  const win = b.dataset.act === 'open' ? window.open('', '_blank') : null;
  const label = b.textContent; b.textContent = '…';
  try {
    const url = URL.createObjectURL(new Blob([await decryptUrl(`f/${it.id}.bin`)], {type:'application/pdf'}));
    if (win) win.location = url;
    else { const a = document.createElement('a'); a.href = url; a.download = it.file; a.click(); }
  } catch (err) { if (win) win.close(); alert('読み込みに失敗しました'); }
  b.textContent = label;
});
$('#go').onclick = () => unlock($('#pw').value);
$('#pw').onkeydown = e => { if (e.key === 'Enter') unlock($('#pw').value); };
$('#q').oninput = render;
try { const s = sessionStorage.getItem('mpw'); if (s) unlock(s); } catch (e) {}
</script>
</body>
</html>
